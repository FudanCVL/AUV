# @package _global_
defaults:
  - _self_

stage: stage1
stages:
  stage1:
    experiment_log_dir: runs/sam3/stage1
    max_epochs: 10
    num_frames_per_clip: 1
    pretrained_uap: null
    weight_l2: 1
  stage2:
    experiment_log_dir: runs/sam3/stage2
    max_epochs: 10
    num_frames_per_clip: 8
    pretrained_uap: ${stages.stage1.experiment_log_dir}/checkpoints/checkpoint.pt
    weight_l2: 10  # Effective scale: 10 / clip_length.
    weight_spatial_uniform: 1  # Sum over subsequent frames (7), divided by clip length.

paths:
  vos_root: /path/to/YouTubeVOS2018/train/
  experiment_log_dir: ${stages.${stage}.experiment_log_dir}
  bpe_path: ./assets/bpe_simple_vocab_16e6.txt.gz
  checkpoint_path: checkpoints/sam3.pt

vos_train:
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomHorizontalFlip
          consistent_transform: True
          p: 0.5
        - _target_: sam3.train.transforms.basic_for_api.RandomAffine
          degrees: 25
          shear: 20
          image_interpolation: bilinear
          consistent_transform: True
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ColorJitter
          consistent_transform: True
          brightness: 0.1
          contrast: 0.03
          saturation: 0.03
          hue: null
        - _target_: sam3.train.transforms.basic_for_api.RandomGrayscale
          p: 0.05
          consistent_transform: True
        - _target_: sam3.train.transforms.basic_for_api.ColorJitter
          consistent_transform: False
          brightness: 0.1
          contrast: 0.05
          saturation: 0.05
          hue: null
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  loss:
    _target_: sam3.train.loss.loss_wrapper.LossFnWrapper
    loss_fns:
      - _target_: sam3.train.loss.loss_fns_uap.MemoryFeatureAttackLoss
        weight_dict:
          loss_memory: 1.0
        weight_l2: ${stages.${stage}.weight_l2}
        weight_repel_l2: 1
        use_l2: true
        use_repel_l2: true
        sigmoid_scale: 20.0
        sigmoid_bias: -10.0

        use_spatial_uniform: true
        weight_spatial_uniform: ${stages.stage2.weight_spatial_uniform}

scratch:
  enable_segmentation: True
  d_model: 256

  scale_by_find_batch_size: True

  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200

  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]

  num_train_workers: 10
  train_batch_size: 1
  gradient_accumulation_steps: 1

  lr_scale: 0.1
  lr_transformer: 4e-3

  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9

  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: 1
    dict_key: all
    with_seg_masks: True

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: True
  max_epochs: ${stages.${stage}.max_epochs}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 10
  mode: train_only
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${vos_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss_vos.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_vos_dataset.Sam3VOSDataset
        root_dir: ${paths.vos_root}
        transforms: ${vos_train.train_transforms}
        training: true
        multiplier: 1
        max_ann_per_img: ${scratch.max_ann_per_img}
        num_frames_per_clip: ${stages.${stage}.num_frames_per_clip}
        frame_stride: 1

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

  model:
    _target_: sam3.model_builder.build_tracker_for_training
    bpe_path: ${paths.bpe_path}
    checkpoint_path: ${paths.checkpoint_path}
    pretrained_uap: ${stages.${stage}.pretrained_uap}
    load_from_HF: false
    freeze_image_encoder: true
    prob_to_use_pt_input_for_train: 0.0
    num_frames_to_correct_for_train: 0
    num_init_cond_frames_for_train: 1
    num_correction_pt_per_frame: 0

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
